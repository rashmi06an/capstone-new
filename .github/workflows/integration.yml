name: Integration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Frontend - Install
        run: npm ci

      - name: Frontend - Build
        run: npm run build

      - name: Frontend - Tests
        run: npm test --if-present

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/build/
            frontend/dist/
          if-no-files-found: warn
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Backend - Install
        run: npm ci

      - name: Backend - Prisma Generate
        run: npx prisma generate

      - name: Backend - Build (if present)
        run: npm run build --if-present

      - name: Backend - Tests (if present)
        run: npm test --if-present
